<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:390px;overflow:hidden;font-family:Segoe UI,system-ui,sans-serif;background:#f6f4ef;color:#1d1b16}
header{padding:56px 22px 14px;font-size:30px;font-weight:700}
.sub{padding:0 22px 16px;color:#6b665c;font-size:15px}
.card{margin:10px 16px;background:#fff;border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center;box-shadow:0 1px 3px #0001}
.dot{width:44px;height:44px;border-radius:12px}
.t{font-weight:600;font-size:17px}.m{color:#7a756b;font-size:14px;margin-top:3px}
.bar{height:8px;border-radius:4px;background:#ece8df;margin-top:8px;width:220px}.bar i{display:block;height:8px;border-radius:4px}
nav{position:fixed;bottom:0;left:0;right:0;height:78px;background:#fff;display:flex;justify-content:space-around;align-items:center;font-size:12px;color:#8a857b;border-top:1px solid #e8e4da}
nav b{color:#1f6b47}
</style></head><body>
<header>Today</header><div class="sub">Tuesday, 3 habits left</div>
<div class="card"><div class="dot" style="background:#ffd166"></div><div><div class="t">Morning walk</div><div class="m">20 min, done at 7:40</div><div class="bar"><i style="width:100%;background:#1f6b47"></i></div></div></div>
<div class="card"><div class="dot" style="background:#8fd3a8"></div><div><div class="t">Drink water</div><div class="m">5 of 8 glasses</div><div class="bar"><i style="width:62%;background:#22a88b"></i></div></div></div>
<div class="card"><div class="dot" style="background:#ef8f6f"></div><div><div class="t">Read</div><div class="m">12 of 30 pages</div><div class="bar"><i style="width:40%;background:#e3456b"></i></div></div></div>
<div class="card"><div class="dot" style="background:#a5b4fc"></div><div><div class="t">Stretch</div><div class="m">not started</div><div class="bar"><i style="width:4%;background:#6d5efc"></i></div></div></div>
<div class="card"><div class="dot" style="background:#f9a8d4"></div><div><div class="t">Journal</div><div class="m">3 lines</div><div class="bar"><i style="width:75%;background:#db2777"></i></div></div></div>
<nav><b>Today</b><span>Streaks</span><span>Stats</span><span>Settings</span></nav>
</body></html>
